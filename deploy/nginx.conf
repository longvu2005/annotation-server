# Add inside your Nginx sites-available/annotation-server file.
# Replace annotation.example.com with your domain and configure HTTPS with certbot.
server {
    listen 80;
    server_name annotation.example.com;
    client_max_body_size 2m;

    # Create credential file: sudo htpasswd -c /etc/nginx/.annotation-users YOUR_USERNAME
    auth_basic "RCR annotation";
    auth_basic_user_file /etc/nginx/.annotation-users;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
